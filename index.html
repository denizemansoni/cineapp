<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineApp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <a href="#" id="home-link"><h1>CineApp</h1></a>
            <form id="search-form">
                <input type="search" id="search-input" placeholder="Buscar filmes e séries...">
                <button type="submit" id="search-button">Buscar</button>
            </form>
            <div class="theme-switch-wrapper">
                <label class="theme-switch" for="checkbox">
                    <input type="checkbox" id="checkbox" />
                    <div class="slider round"></div>
                </label>
            </div>
        </div>
    </header>

    <main class="container">
        <nav class="category-tabs">
            <button class="tab-button active" data-category="popular">Populares</button>
            <button class="tab-button" data-category="top_rated">Mais Votados</button>
            <button class="tab-button" data-category="favorites">Meus Favoritos</button>
        </nav>
        <h2 id="category-title">Filmes Populares</h2>

        <!-- Overlay de Carregamento com Spinner -->
        <div id="loader-overlay" class="loader-overlay">
            <div class="loader"></div>
        </div>

        <div id="movies-container" class="movies-grid">
            <!-- Os filmes serão inseridos aqui via JavaScript -->
        </div>
    </main>

    <!-- Modal para detalhes do filme (inicialmente oculto) -->
    <div id="movie-modal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <div id="modal-body">
                <!-- Conteúdo do filme será inserido aqui via JavaScript -->
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 CineApp. Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
